allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20261101.0-beta
  - wrangler@4.156.1
  - '@cloudflare/vite-plugin@1.67.0'
# The Cloudflare Vite plugin ships its pinned Miniflare/workerd pair; 1.67.0 is the
# release whose workerd supports this repo's wrangler compatibility_date (2026-11-02).
# Drop the pin once @astrojs/cloudflare's own range resolves past 1.66.0.
overrides:
  '@cloudflare/vite-plugin': 1.67.0
