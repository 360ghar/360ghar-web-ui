[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  API_ORIGIN = "https://api.360ghar.com"
  # Public ids (the same as the old site's index.html).
  PUBLIC_GA_ID = "G-0S1Q7466MM"
  PUBLIC_POSTHOG_HOST = "https://us.i.posthog.com"
  # Backend PRs #51-#53 are deployed: OG cards from the API, and the owner AI tools (drafters, listing writer, staging).
  OG_FROM_API = "true"
  PUBLIC_AI_OWNER_TOOLS = "true"

# Deploy previews run on *.netlify.app, which the API CORS policy does not
# allow, so the browser uses the same-origin proxy below.
[context.deploy-preview.environment]
  PUBLIC_API_BASE = ""
[context.branch-deploy.environment]
  PUBLIC_API_BASE = ""

# ---- Redirects and proxies. Legacy path rules live in src/lib/redirects.ts (middleware). ----

[[redirects]]
  from = "https://www.360ghar.com/*"
  to = "https://360ghar.com/:splat"
  status = 301
  force = true

# Deep-link files are owned by the backend.
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "https://api.360ghar.com/.well-known/assetlinks.json"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "https://api.360ghar.com/.well-known/apple-app-site-association"
  status = 200
  force = true

# Same-origin API proxy (dev parity, deploy previews). The old site used /api/*.
[[redirects]]
  from = "/api/v1/*"
  to = "https://api.360ghar.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://api.360ghar.com/api/v1/:splat"
  status = 200
  force = true

# ---- Headers ----

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# Hashed build assets are content-addressed.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

# Paper-cut drawings served as files (src/pages/art/**). No content hash, so one day.
[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Prerendered HTML: short browser cache, longer edge cache (purged on deploy).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=604800"
    Netlify-CDN-Cache-Control = "public, durable, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/"
  [headers.values]
    Link = '''</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </for-ai>; rel="service-doc"; type="text/html", </data/llm-feed.json>; rel="service-meta"; type="application/json", </.well-known/mcp/server-card.json>; rel="mcp-server", </.well-known/agent-skills/index.json>; rel="agent-skills", </llms.txt>; rel="llms-txt", </.well-known/openid-configuration>; rel="openid-configuration"'''

# The old PWA worker must never be cached, so its replacement can unregister it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Discovery files: open CORS and a one-hour cache. The blocks below add only the Content-Type.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"

[[headers]]
  for = "/.well-known/openid-configuration"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/oauth-authorization-server"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/oauth-protected-resource"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/agent-skills/*/SKILL.md"
  [headers.values]
    Content-Type = "text/markdown"

[[headers]]
  for = "/.well-known/acp.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/ucp"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/ai.txt"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/openapi.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
